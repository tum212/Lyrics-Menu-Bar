[package]
name = "lyrics-core"
version = "2.0.0"
edition = "2021"

[lib]
name = "lyrics_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
urlencoding = "2"
regex = "1"
encoding_rs = "0.8"
unicode-normalization = "0.1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
